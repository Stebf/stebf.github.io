<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fight Night Bracket</title>
	<style>
		:root {
			--ink: #17231f;
			--muted: #65736d;
			--paper: #ffffff;
			--panel: #ffffff;
			--line: #d9dee0;
			--accent: #d95d39;
			--accent-dark: #9e3821;
			--green: #26735b;
			--green-soft: #e5f1eb;
			--row-line: #ebe7de;
			--shadow: 0 18px 45px rgba(35, 43, 38, .09);
		}
		body.dark-mode {
			--ink: #edf4fc;
			--muted: #98a9bb;
			--paper: #070b12;
			--panel: #101923;
			--line: #26394b;
			--accent-dark: #ff9879;
			--green: #62bd99;
			--row-line: #1d2b3a;
			--shadow: 0 18px 45px rgba(0, 0, 0, .22);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: Georgia, "Times New Roman", serif;
			line-height: 1.4;
		}
		body::before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: .32;
			background-image: radial-gradient(#d7dddc .7px, transparent .7px);
			background-size: 15px 15px;
		}
		body.dark-mode::before { opacity: .2; background-image: radial-gradient(#46627c .7px, transparent .7px); }
		main { position: relative; max-width: 1500px; margin: 0 auto; padding: 42px 28px 64px; }
		header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 30px; }
		.eyebrow { margin: 0 0 8px; color: var(--accent-dark); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
		h1 { margin: 0; font-size: clamp(38px, 6vw, 76px); line-height: .95; font-weight: 700; letter-spacing: 0; }
		.intro { max-width: 410px; margin: 0; color: var(--muted); font: 15px/1.55 Arial, sans-serif; }
		button { border: 0; cursor: pointer; font: inherit; }
		.reset { padding: 12px 17px; color: #fff; background: var(--ink); border-radius: 3px; font: 700 12px Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
		.reset:hover, .reset:focus-visible { background: var(--accent-dark); }
		.dark-mode .reset { color: #edf4fc; background: #1b2a3a; }
		.theme-toggle { margin-right: 8px; padding: 12px 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 3px; font: 700 12px Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
		.theme-toggle:hover, .theme-toggle:focus-visible { border-color: var(--accent); color: var(--accent-dark); }
		.section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
		h2 { margin: 0; font-size: 25px; }
		.save-status { color: var(--muted); font: 12px Arial, sans-serif; }
		.mode-switch { display: inline-flex; gap: 4px; margin-bottom: 18px; padding: 4px; background: #eef2f5; border-radius: 3px; }
		.dark-mode .mode-switch { background: #0d151f; }
		.mode-button { padding: 9px 13px; color: var(--muted); background: transparent; border-radius: 2px; font: 700 11px Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
		.mode-button:hover, .mode-button:focus-visible { color: var(--ink); background: #f5f8fa; }
		.dark-mode .mode-button:hover, .dark-mode .mode-button:focus-visible { background: #1b2a3a; }
		.mode-button.active { color: #fff; background: var(--green); }
		.seed-panel { padding: 24px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
		.seeds { display: grid; grid-template-columns: repeat(4, minmax(145px, 1fr)); gap: 12px; margin: 0; }
		.seed-label { display: grid; gap: 6px; color: var(--muted); font: 700 11px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
		input { width: 100%; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); background: var(--paper); font: 17px Georgia, serif; }
		input:focus { outline: 2px solid rgba(217, 93, 57, .32); border-color: var(--accent); }
		.seed-label input { padding: 11px 12px; }
		.seed-error { min-height: 18px; margin: 12px 0 0; color: var(--accent-dark); font: 12px Arial, sans-serif; }
		.bracket-shell { min-height: 100vh; margin-top: 42px; padding-top: 8px; overflow-x: auto; scroll-margin-top: 0; }
		.bracket { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 30px; min-width: 1120px; }
		.bracket.compact { grid-template-columns: repeat(3, minmax(250px, 1fr)); min-width: 880px; }
		.round { display: flex; flex-direction: column; }
		.round-title { margin: 0 0 13px; color: var(--accent-dark); font: 700 12px Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
		.round-matches { display: flex; flex: 1; flex-direction: column; justify-content: space-around; gap: 16px; }
		.round:last-child .round-matches { position: relative; justify-content: flex-start; }
		.round:last-child .match { position: absolute; right: 0; left: 0; }
		.round:last-child .match:first-child { top: 0; }
		.round:last-child .match:last-child { top: 50%; transform: translateY(-50%); }
		.round:nth-last-child(2) .round-matches { position: relative; }
		.round:nth-last-child(2) .round-matches::before { content: ""; position: absolute; top: 25%; right: -18px; height: 50%; border-right: 1px solid var(--line); }
		.round:nth-last-child(2) .round-matches::after { content: ""; position: absolute; top: 50%; right: -36px; width: 18px; border-top: 1px solid var(--line); }
		.match { position: relative; padding: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(35, 43, 38, .05); }
		.match::after { content: ""; position: absolute; right: -31px; top: 50%; width: 30px; border-top: 1px solid var(--line); }
			.round:last-child .match::after { display: none; }
		.match-meta { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--muted); font: 11px Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
		.match-state { color: var(--accent-dark); }
		.match-state.complete { color: var(--green); }
		.player-row { display: grid; grid-template-columns: 1fr 60px; align-items: center; gap: 10px; min-height: 45px; padding: 7px 0; border-top: 1px solid var(--row-line); }
		.player-row:first-of-type { border-top: 0; }
		.player-name { overflow: hidden; color: var(--muted); font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
		.player-name.ready { color: var(--ink); }
		.player-name.winner { color: var(--green); font-weight: 700; }
		.score { padding: 7px 6px; text-align: center; font-family: Arial, sans-serif; font-size: 16px; }
		.score:disabled { color: #aaa; background: var(--line); cursor: not-allowed; }
		.match-note { min-height: 18px; margin: 9px 0 0; color: var(--muted); font: 11px/1.35 Arial, sans-serif; }
		.match-note.warning { color: var(--accent-dark); }
		.champion { display: none; margin: 22px 0 0; padding: 18px 20px; color: #fff; background: var(--green); font-size: 23px; text-align: center; }
		.champion.visible { display: block; }
		.champion small { display: block; margin-bottom: 4px; font: 700 11px Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
		@media (max-width: 760px) {
			main { padding: 28px 16px 48px; }
			header { align-items: start; flex-direction: column; }
			.intro { max-width: none; }
			.reset { align-self: start; }
			.seed-panel { padding: 17px; }
			.seeds { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
		}
		@media (min-width: 1000px) {
			main { max-width: 1680px; padding: 24px 30px 34px; }
			header { margin-bottom: 18px; }
			h1 { font-size: 58px; }
			.seed-panel { padding: 16px 18px; }
			.mode-switch { margin-bottom: 10px; }
			.seed-label input { padding: 8px 10px; }
			.bracket-shell { display: flex; min-height: calc(100vh - 24px); margin-top: 24px; padding-top: 8px; overflow-x: visible; flex-direction: column; }
			.bracket { flex: 1; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; min-width: 0; }
			.bracket.compact { grid-template-columns: repeat(3, minmax(0, 1fr)); min-width: 0; }
			.round-title { margin-bottom: 8px; font-size: 13px; }
			.round-matches { gap: 10px; }
			.match { padding: 9px 10px; }
			.match-meta { margin-bottom: 5px; font-size: 11px; }
			.player-row { grid-template-columns: 1fr 48px; gap: 7px; min-height: 34px; padding: 4px 0; }
			.player-name { font-size: 18px; }
			.score { padding: 4px; font-size: 17px; }
			.match-note { min-height: 13px; margin-top: 5px; font-size: 11px; }
			.champion { margin-top: 14px; padding: 12px 16px; font-size: 19px; }
		}
	</style>
</head>
<body>
	<main>
		<header>
			<div>
				<p class="eyebrow" id="tournament-size">Twelve player tournament</p>
				<h1>Fight Night</h1>
			</div>
			<div>
				<p class="intro">Name your seeds, and enter each result</p>
				<button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
				<button class="reset" id="reset-button" type="button">Reset bracket</button>
			</div>
		</header>

		<section class="seed-panel" aria-labelledby="seed-heading">
			<div class="section-heading">
				<h2 id="seed-heading">Seed table</h2>
				<span class="save-status" id="save-status" role="status">Saved locally</span>
			</div>
			<div class="mode-switch" aria-label="Tournament size">
				<button class="mode-button" data-player-count="8" type="button">8 players</button>
				<button class="mode-button" data-player-count="12" type="button">12 players</button>
			</div>
			<div class="seeds" id="seed-list"></div>
			<p class="seed-error" id="seed-error" role="alert"></p>
		</section>

		<section class="bracket-shell" aria-labelledby="bracket-heading">
			<div class="section-heading">
				<h2 id="bracket-heading">Tournament bracket</h2>
			</div>
			<div class="bracket" id="bracket"></div>
			<div class="champion" id="champion" aria-live="polite"></div>
		</section>
	</main>

	<script>
		(() => {
			const STORAGE_KEY = "fight-night-bracket-v2";
			const THEME_KEY = "fight-night-theme-v1";
			const definitions = {
				8: [
					{ id: "qf1", round: "Quarterfinals", label: "Match 1", sources: ["seed:3", "seed:4"] },
					{ id: "qf2", round: "Quarterfinals", label: "Match 2", sources: ["seed:0", "seed:7"] },
					{ id: "qf3", round: "Quarterfinals", label: "Match 3", sources: ["seed:1", "seed:6"] },
					{ id: "qf4", round: "Quarterfinals", label: "Match 4", sources: ["seed:2", "seed:5"] },
					{ id: "sf1", round: "Semifinals", label: "Match 1", sources: ["qf1", "qf2"] },
					{ id: "sf2", round: "Semifinals", label: "Match 2", sources: ["qf3", "qf4"] },
					{ id: "third", round: "Final", label: "3rd Place", sources: ["loser:sf1", "loser:sf2"] },
					{ id: "final", round: "Final", label: "Championship", sources: ["sf1", "sf2"] }
				],
				12: [
					{ id: "p1", round: "Playoffs", label: "5 vs 12", sources: ["seed:4", "seed:11"] },
					{ id: "p2", round: "Playoffs", label: "8 vs 9", sources: ["seed:7", "seed:8"] },
					{ id: "p3", round: "Playoffs", label: "7 vs 10", sources: ["seed:6", "seed:9"] },
					{ id: "p4", round: "Playoffs", label: "6 vs 11", sources: ["seed:5", "seed:10"] },
					{ id: "qf1", round: "Quarterfinals", label: "Match 1", sources: ["seed:3", "p1"] },
					{ id: "qf2", round: "Quarterfinals", label: "Match 2", sources: ["seed:0", "p2"] },
					{ id: "qf3", round: "Quarterfinals", label: "Match 3", sources: ["seed:1", "p3"] },
					{ id: "qf4", round: "Quarterfinals", label: "Match 4", sources: ["seed:2", "p4"] },
					{ id: "sf1", round: "Semifinals", label: "Match 1", sources: ["qf1", "qf2"] },
					{ id: "sf2", round: "Semifinals", label: "Match 2", sources: ["qf3", "qf4"] },
					{ id: "third", round: "Final", label: "3rd Place", sources: ["loser:sf1", "loser:sf2"] },
					{ id: "final", round: "Final", label: "Championship", sources: ["sf1", "sf2"] }
				]
			};
			const defaultState = () => ({ playerCount: 12, names: Array(12).fill(""), matches: {} });
			let state = loadState();

			const seedList = document.querySelector("#seed-list");
			const bracket = document.querySelector("#bracket");
			const seedError = document.querySelector("#seed-error");
			const champion = document.querySelector("#champion");
			const saveStatus = document.querySelector("#save-status");
			const modeButtons = document.querySelectorAll(".mode-button");
			const tournamentSize = document.querySelector("#tournament-size");
			const themeToggle = document.querySelector("#theme-toggle");

			function setTheme(isDark) {
				document.body.classList.toggle("dark-mode", isDark);
				themeToggle.textContent = isDark ? "Light mode" : "Dark mode";
				themeToggle.setAttribute("aria-pressed", String(isDark));
				try { localStorage.setItem(THEME_KEY, isDark ? "dark" : "light"); } catch (error) {}
			}

			function loadTheme() {
				try { return localStorage.getItem(THEME_KEY) === "dark"; } catch (error) { return false; }
			}

			function matchDefinitions() { return definitions[state.playerCount]; }

			function loadState() {
				try {
					const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
					if (saved && Array.isArray(saved.names) && saved.names.length === 12) {
						return { playerCount: saved.playerCount === 8 ? 8 : 12, names: saved.names.map(name => typeof name === "string" ? name : ""), matches: saved.matches || {} };
					}
				} catch (error) {}
				return defaultState();
			}

			function saveState() {
				try {
					localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
					saveStatus.textContent = "Saved locally";
				} catch (error) {
					saveStatus.textContent = "Local saving unavailable";
				}
			}

			function nameForSource(source) {
				if (source.startsWith("seed:")) return state.names[Number(source.slice(5))].trim();
				const matchId = source.startsWith("loser:") ? source.slice(6) : source;
				const match = state.matches[matchId];
				if (source.startsWith("loser:")) return match && match.loser ? match.loser : "";
				return match && match.winner ? match.winner : "";
			}

			function participants(definition) {
				return definition.sources.map(nameForSource);
			}

			function isValidScore(value) { return value !== "" && Number.isInteger(Number(value)) && Number(value) >= 0 && Number(value) <= 3; }

			function hasDuplicateNames() {
				const names = state.names.slice(0, state.playerCount).map(name => name.trim()).filter(Boolean);
				return names.some((name, index) => names.indexOf(name) !== index);
			}

			function restoreTextCursor(input, selectionStart, selectionEnd) {
				if (!input) return;
				input.focus();
				if (typeof input.setSelectionRange === "function") {
					input.setSelectionRange(selectionStart, selectionEnd);
				}
			}

			function normalizeMatches() {
				matchDefinitions().forEach(definition => {
					const match = state.matches[definition.id] || {};
					const players = participants(definition);
					const scores = Array.isArray(match.scores) && match.scores.length === 2 ? match.scores.map(score => score === "" ? "0" : String(score)) : ["0", "0"];
					const hasPlayers = players.every(Boolean);
					const scoresMatch = scores.length === 2 && scores.every(isValidScore);
					const winnerIndex = scoresMatch && Number(scores[0]) !== Number(scores[1]) && (Number(scores[0]) === 3 || Number(scores[1]) === 3) ? Number(scores[1]) === 3 ? 1 : 0 : -1;
					const winner = hasPlayers && !hasDuplicateNames() && winnerIndex >= 0 ? players[winnerIndex] : "";
					const loser = hasPlayers && !hasDuplicateNames() && winnerIndex >= 0 ? players[1 - winnerIndex] : "";
					state.matches[definition.id] = { scores, winner, loser };
				});
			}

			function renderSeeds() {
				seedList.innerHTML = state.names.slice(0, state.playerCount).map((name, index) => `<label class="seed-label">Seed ${index + 1}<input data-seed="${index}" type="text" maxlength="32" value="${escapeHtml(name)}" placeholder="Player ${index + 1}"></label>`).join("");
				seedList.querySelectorAll("input").forEach(input => input.addEventListener("input", event => {
					const selectionStart = event.target.selectionStart;
					const selectionEnd = event.target.selectionEnd;
					state.names[Number(event.target.dataset.seed)] = event.target.value;
					normalizeMatches();
					render();
					saveState();
					const updated = seedList.querySelector(`[data-seed="${event.target.dataset.seed}"]`);
					restoreTextCursor(updated, selectionStart, selectionEnd);
				}));
			}

			function renderMatch(definition) {
				const match = state.matches[definition.id];
				const players = participants(definition);
				const ready = players.every(Boolean) && !hasDuplicateNames();
				const complete = Boolean(match.winner);
				const duplicateNames = hasDuplicateNames();
				const invalidScores = match.scores.some(score => score !== "") && match.scores.some(score => !isValidScore(score));
				const tiedScores = ready && match.scores[0] === "3" && match.scores[1] === "3";
				const note = duplicateNames ? "Player names must be unique" : invalidScores ? "Use whole numbers from 0 to 3" : tiedScores ? "Ties need a deciding score" : complete ? `${match.winner} advances` : "";
				const noteClass = duplicateNames || invalidScores || tiedScores ? "warning" : "";
				return `<article class="match"><div class="match-meta"><span>${definition.label}</span><span class="match-state ${complete ? "complete" : ""}">${complete ? "Complete" : "Open"}</span></div>${players.map((player, index) => `<div class="player-row"><span class="player-name ${player ? "ready" : ""} ${match.winner === player ? "winner" : ""}">${escapeHtml(player || "Waiting on result")}</span><input class="score" data-match="${definition.id}" data-player="${index}" type="number" min="0" max="3" step="1" inputmode="numeric" aria-label="${escapeHtml(player || `Player ${index + 1}`)} score" value="${escapeHtml(match.scores[index] ?? "0")}" ${ready ? "" : "disabled"}></div>`).join("")}<p class="match-note ${noteClass}">${note}</p></article>`;
			}

			function renderBracket() {
				const rounds = state.playerCount === 12 ? ["Playoffs", "Quarterfinals", "Semifinals", "Final"] : ["Quarterfinals", "Semifinals", "Final"];
				bracket.classList.toggle("compact", state.playerCount === 8);
				bracket.innerHTML = rounds.map(round => `<div class="round"><h3 class="round-title">${round}</h3><div class="round-matches">${matchDefinitions().filter(definition => definition.round === round).map(renderMatch).join("")}</div></div>`).join("");
				bracket.querySelectorAll(".score").forEach(input => input.addEventListener("input", event => {
					const match = state.matches[event.target.dataset.match];
					match.scores[Number(event.target.dataset.player)] = event.target.value;
					normalizeMatches();
					render();
					saveState();
					const updated = bracket.querySelector(`[data-match="${event.target.dataset.match}"][data-player="${event.target.dataset.player}"]`);
					if (updated) updated.focus();
				}));
			}

			function render() {
				normalizeMatches();
				renderSeeds();
				renderBracket();
				const normalizedNames = state.names.slice(0, state.playerCount).map(name => name.trim()).filter(Boolean);
				const duplicates = normalizedNames.filter((name, index) => normalizedNames.indexOf(name) !== index);
				modeButtons.forEach(button => button.classList.toggle("active", Number(button.dataset.playerCount) === state.playerCount));
				tournamentSize.textContent = `${state.playerCount} player tournament`;
				seedError.textContent = duplicates.length ? "Each player name must be unique." : "";
				const finalWinner = state.matches.final && state.matches.final.winner;
				champion.classList.toggle("visible", Boolean(finalWinner));
				champion.innerHTML = finalWinner ? `<small>Champion</small>${escapeHtml(finalWinner)}` : "";
			}

			function escapeHtml(value) {
				return String(value).replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" })[character]);
			}

			document.querySelector("#reset-button").addEventListener("click", () => {
				if (confirm("Reset all names and scores?")) {
					state = defaultState();
					localStorage.removeItem(STORAGE_KEY);
					render();
					saveStatus.textContent = "Bracket reset";
				}
			});

			themeToggle.addEventListener("click", () => setTheme(!document.body.classList.contains("dark-mode")));

			modeButtons.forEach(button => button.addEventListener("click", () => {
				const playerCount = Number(button.dataset.playerCount);
				if (playerCount === state.playerCount) return;
				state.playerCount = playerCount;
				state.matches = {};
				render();
				saveState();
			}));

			setTheme(loadTheme());
			render();
		})();
	</script>
</body>
</html>
